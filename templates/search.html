<!DOCTYPE html>
<html>
    <head>
        <title>Search Results</title>
        <link rel="stylesheet"  href="{{ url_for('static', filename='style.css') }}">
    </head>
<body>
    <header>
        <h1>Seacrch Results</h1>
        <nav>
            <a href="/" class="home">Home</a>
            <a href="/live" class="live">Live</a>
            <a href="/cart" class="cart">Cart</a>
            <a href="/profile" class="profile">Profile</a>
        </nav>
    </header>

    <main>


        
        <h2>Results for "{{ query }}"</h2>



        {% if results %}
            <section class="product">
                {% for product in results %}
                <div class="product">
                    <h2 class="name">{{ product.name }}</h2>
                    <p class="price">${{ product.price }}</p>
                    <a class="view-product" href="{{ url_for('product_detail', product_id=product.id) }}">View Product</a>
                    </div>
                {% endfor %}
            </section>
        {% else %}
            <h2>No products found.</h2>
        {% endif %}





    </main>







</body>
</html>
