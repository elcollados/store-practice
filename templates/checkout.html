<!DOCTYPE html>
<html>
    <head>
        <title>Checkout</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
<body>
    <header>
        <h1>Checkout</h1>
        <nav>
            <a href="/" class="home">Home</a>
            <a href="/live" class="live">Videos</a>
            <a href="/cart" class="cart">Cart</a>
            <a href="/profile" class="profile">Profile</a>
            <a href="/logout" class="logout">Logout</a>
        </nav>
    </header>
<main>
    <h2 class="label">Your Information</h2>
    <br><br>
    <form action="/place-order" method="POST">
        <div class="checkout">
        <label class="text">Name:</label>
        <input class="textbox" type="text" name="name" required>
        <br>
        <label class="text">Address:</label>
        <input class="textbox" type="text" name="address" required>
        
        <br>
        <button type="submit" class="checkout-button">Place Order</button>

        </div>
    </form>


</main>
</body>
</html>
